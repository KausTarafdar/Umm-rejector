[package]
name = "umm-rejector-tui"
version = "0.1.0"
edition = "2021"
description = "Local-first speaking coach TUI: flag every um and uh as you talk"

[dependencies]
anyhow = "1"
crossterm = "0.28"
cpal = "0.15"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["json"] }
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
