questions:
  - How did you feel about your week so far?
  - What is a skill you would love to get better at, and why?
  - Tell me about a recent decision you were proud of.
  - What is something you changed your mind about recently?
  - If you could fix one thing about your daily routine, what would it be?
  - What is a book, show, or game that stuck with you lately?
  - How would you describe your ideal day off?
  - What is something you are looking forward to?
  - Tell me about a time you had to explain something tricky to someone.
  - What advice would you give yourself a year ago?
