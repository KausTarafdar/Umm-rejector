[project]
name = "umm-daemon"
version = "0.1.0"
description = "Umm-rejector orchestrator daemon: sidecar lifecycle, filler spotting, scoring, storage"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "onnxruntime>=1.19",
    "numpy>=2.0",
    "pyyaml>=6",
]

[project.scripts]
umm-serve = "umm.main:serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["umm*"]

[tool.ruff]
line-length = 100
